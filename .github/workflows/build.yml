  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────────
  build-darwin-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: brew install nasm
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-arm64-osx-zenpix-${{ hashFiles('vcpkg.json', 'cmake/triplets/arm64-osx-zenpix.cmake') }}-v1
      - name: Install static vcpkg dependencies
        run: |
          vcpkg install --triplet arm64-osx-zenpix \
            --overlay-triplets=cmake/triplets \
            --x-install-root=${{ github.workspace }}/vcpkg_installed
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install JS deps and build wrapper
        run: bun install --frozen-lockfile && bun run build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DZENPIX_ENABLE_SIMD=ON \
            -DZENPIX_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx-zenpix \
            -DVCPKG_OVERLAY_TRIPLETS=cmake/triplets \
            -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed
          cmake --build build --parallel
      - name: Test — native SIMD path
        run: ctest --test-dir build --output-on-failure
      - name: Build — forced scalar reference
        run: |
          cmake -S . -B build-scalar -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DZENPIX_ENABLE_SIMD=OFF \
            -DZENPIX_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx-zenpix \
            -DVCPKG_OVERLAY_TRIPLETS=cmake/triplets \
            -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed
          cmake --build build-scalar --parallel
          ctest --test-dir build-scalar --output-on-failure
      - name: Test — shared-library SIMD vs scalar
        run: ZENPIX_SIMD_LIB="$PWD/build/libpict.dylib" ZENPIX_SCALAR_LIB="$PWD/build-scalar/libpict.dylib" bun run test/resize_simd_precision.ts
      - name: Benchmark — NEON vs scalar (3 trials)
        run: |
          for trial in 1 2 3; do
            echo "trial=$trial"
            ZENPIX_SIMD_LIB="$PWD/build/libpict.dylib" \
              ZENPIX_SCALAR_LIB="$PWD/build-scalar/libpict.dylib" \
              BENCH_WARMUP_N=3 BENCH_MEASURE_N=15 \
              bun run bench/resize-simd.ts
          done
      - name: Test — Lanczos-3 precision
        run: bun run test/lanczos_precision.ts
      - name: Test — ops precision
        run: bun run test/ops_precision.ts
      - name: Test — AVIF alpha, CICP, and ICC roundtrip
        run: ZENPIX_LIB="$PWD/build/libpict.dylib" bun run test/avif_roundtrip.ts
      - name: Verify — self-contained macOS 12 artifact
        run: node scripts/verify-native-dependencies.mjs darwin build/libpict.dylib
      - name: Pack and smoke — Node.js / Bun / Deno / CLI
        run: node scripts/pack-native-ci.mjs zenpix-darwin-arm64 build/libpict.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: libpict-darwin-arm64
          path: |
            build/libpict.dylib
            packed/zenpix-darwin-arm64-1.0.3.tgz

