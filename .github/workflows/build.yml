  # ── Windows x64 ────────────────────────────────────────────────────────────
  build-windows-x64:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Enable MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-x64-windows-static-md-${{ hashFiles('vcpkg.json') }}-v1
      - name: Install vcpkg dependencies
        run: vcpkg install --triplet x64-windows-static-md
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install JS deps and build wrapper
        run: bun install --frozen-lockfile && bun run build
      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZENPIX_ENABLE_SIMD=ON \
            -DZENPIX_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build build --parallel
      - name: Test — native SIMD path
        run: ctest --test-dir build --output-on-failure
      - name: Build — forced scalar reference
        run: |
          cmake -S . -B build-scalar -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DZENPIX_ENABLE_SIMD=OFF \
            -DZENPIX_BUILD_TESTS=ON \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          cmake --build build-scalar --parallel
          ctest --test-dir build-scalar --output-on-failure
      - name: Test — shared-library SIMD vs scalar
        run: ZENPIX_SIMD_LIB="$PWD/build/libpict.dll" ZENPIX_SCALAR_LIB="$PWD/build-scalar/libpict.dll" bun run test/resize_simd_precision.ts
      - name: Test — Lanczos-3 precision
        run: bun run test/lanczos_precision.ts
      - name: Test — ops precision
        run: bun run test/ops_precision.ts
      - name: Test — AVIF alpha, CICP, and ICC roundtrip
        run: ZENPIX_LIB="$PWD/build/libpict.dll" bun run test/avif_roundtrip.ts
      - name: Verify — distributable runtime dependencies
        run: node scripts/verify-native-dependencies.mjs win32 build/libpict.dll
      - name: Pack and smoke — Node.js / Bun / Deno / CLI
        run: node scripts/pack-native-ci.mjs zenpix-win32-x64 build/libpict.dll
      - uses: actions/upload-artifact@v4
        with:
          name: libpict-win32-x64
          path: |
            build/libpict.dll
            packed/zenpix-win32-x64-1.0.3.tgz

  # ── Browser WASM baseline + SIMD ───────────────────────────────────────────
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: emscripten-core/setup-emsdk@v16
        with:
          version: 5.0.5
          actions-cache-folder: emsdk-cache
      - name: Install JS dependencies
        run: bun install --frozen-lockfile
      - name: Build — clean baseline and SIMD
        run: ZENPIX_COPY_WEBSITE=0 npm run build:all --prefix wasm
      - name: Test — generated Node-compatible WASM
        run: npm test --prefix wasm
      - name: Pack — fail closed on missing dist
        run: mkdir -p packed && npm pack ./wasm --pack-destination packed
      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
      - name: Test — packed baseline and SIMD in Chromium
        run: node scripts/test-packed-wasm-browser.mjs packed/zenpix-wasm-1.1.0.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: zenpix-wasm-1.1.0
          path: packed/zenpix-wasm-1.1.0.tgz

  # ── JS wrapper build (type-check + dist) ──────────────────────────────────
  build-js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install JS deps
        run: bun install --frozen-lockfile
      - name: Build JS wrapper
        run: bun run build
      - name: Pack root package
        run: mkdir -p packed && npm pack . --pack-destination packed
      - uses: actions/upload-artifact@v4
        with:
          name: zenpix-root-1.0.3
          path: packed/zenpix-1.0.3.tgz

  # ── Documentation site build ──────────────────────────────────────────────
  build-website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install website dependencies
        run: bun install --cwd website --frozen-lockfile
      - name: Build documentation site
        run: bun run --cwd website build

  # ── Release candidate: exactly seven independently built tarballs ─────────
  verify-release-candidate:
    runs-on: ubuntu-latest
    needs:
      - build-linux-x64
      - build-linux-arm64
      - build-darwin-arm64
      - build-darwin-x64
      - build-windows-x64
      - build-wasm
      - build-js
      - build-website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
      - name: Verify package set, metadata, and required files
        run: node scripts/verify-release-candidate.mjs downloaded-artifacts release-candidate
      - uses: actions/upload-artifact@v4
        with:
          name: zenpix-release-candidate
          path: release-candidate
